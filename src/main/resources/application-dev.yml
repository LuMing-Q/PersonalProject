spring:
  mvc:
    static-path-pattern: /static/**
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB
      enabled: true
      file-size-threshold: 0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/qkj_project?useUnicode = true&characterEncoding = utf8&useSSL = false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: Admin@123
    virtual-host: /study
    # 开启 Confirm 确认模式
    publisher-confirm-type: correlated
    # 开启 Return 确认模式
    publisher-returns: true
    template:
      # 必须路由，否则回调
      mandatory: true
    # 开启消费者重试机制
    listener:
      simple:
        acknowledge-mode: manual
        # 预取数量
        prefetch: 1

mq:
  exchange:
    option-log: option-log-exchange
    option-log-dlx: option-log-dlx
    inform: inform-exchange
  queue:
    option-log: option-log-queue
    option-log-dead: option-log-dead-queue
    inform-station: inform-station-queue
    inform-sms: inform-sms-queue

logging:
  level:
    com.qkj.project: debug

# 路径拦截
auth:
  # 不需要 token 校验的接口
  ignoreUrls: '/qkj/login,/qkj/file/file_content,/qkj/file/url,/qkj/file'
  # token 以参数的方式传递到后端的接口 eg: 文件上传、文件下载
  queryUrls: ''
  public-key: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAI71DbL/2sMTAmP22jdlhhU9TiVHjWr3I/kDTX821puYX5Q6nkb9bcTi3KjIMczTbSw4Lnem0flidzBtene+ltUCAwEAAQ==
  private-key: 
  type: jwt # 现有 1-jwt:通过 jwt 生成 token, 2-redis: 通过 redis 存储 token
  login-expire-time: 3600 # redis 过期时间 8小时

