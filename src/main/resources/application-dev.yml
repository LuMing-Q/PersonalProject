spring:
  mvc:
    static-path-pattern: /static/**
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB
      enabled: true
      file-size-threshold: 0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/qkj_project?useUnicode = true&characterEncoding = utf8&useSSL = false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
  rabbitmq:
    host: 192.168.100.132
    port: 5672
    username: admin
    password: Admin@123
    virtual-host: /study

logging:
  level:
    com.qkj.project: DEBUG # 返回日志级别

# 路径拦截
auth:
  # 不需要 token 校验的接口
  ignoreUrls: '/qkj/login,/qkj/file/file_content,/qkj/file/url,/qkj/file'
  # token 以参数的方式传递到后端的接口 eg: 文件上传、文件下载
  queryUrls: ''
  public-key: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAI71DbL/2sMTAmP22jdlhhU9TiVHjWr3I/kDTX821puYX5Q6nkb9bcTi3KjIMczTbSw4Lnem0flidzBtene+ltUCAwEAAQ==
  private-key: 
  type: jwt # 现有 1-jwt:通过 jwt 生成 token, 2-redis: 通过 redis 存储 token
  login-expire-time: 3600 # redis 过期时间 8小时

# minio 存储地址
unify:
  minio:
    endpoint: http://13.11.100.52:31506 # 易智瑞
    accessKey: minioAdmin
    secretKey: Admin@123
    bucketName: personal-minio

# 异步任务线程池配置
task:
  pool:
    corePoolSize: 10
    maxPoolSize: 20
    keepAliveSeconds: 300
    queueCapacity: 50